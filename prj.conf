# Common configurations for all boards

# General
CONFIG_HW_ID_LIBRARY=y
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONNECTION_MANAGER=y

# ZBus
CONFIG_ZBUS=y

# Zephyr state framework
CONFIG_SMF=y

# MQTT
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
# Sparkplug NBIRTH includes the full metric schema and current values.
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=512
CONFIG_DATE_TIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Webdock MQTT broker and Thingy:91 X publisher identity/topic.
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_HOSTNAME="gruppe7.vps.webdock.cloud"
CONFIG_MQTT_SAMPLE_TRANSPORT_CLIENT_ID="thingy91x-01"
CONFIG_MQTT_SAMPLE_TRANSPORT_PUBLISH_TOPIC="data"
CONFIG_MQTT_SAMPLE_TRIGGER_TIMEOUT_SECONDS=10
CONFIG_MQTT_SAMPLE_TRANSPORT_DUMP_SAMPLE_COUNT=30
CONFIG_MQTT_SAMPLE_TRANSPORT_SAMPLE_BUFFER_SIZE=32

# BME680 sensor readings. The transport serializes numeric samples as Sparkplug B.
CONFIG_SENSOR=y
